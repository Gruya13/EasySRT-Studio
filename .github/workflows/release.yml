name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: ubuntu-22.04
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build and publish Tauri bundles
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "EasySRT Studio v__VERSION__"
          releaseBody: "See the assets below to download EasySRT Studio (Windows NSIS installer, Windows Portable ZIP, or Linux AppImage)."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Package Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $stageDir = Join-Path $PWD "portable-stage"
          $resourcesDir = Join-Path $stageDir "resources"
          New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null

          $exePath = Join-Path $PWD "src-tauri\target\release\easysrt-studio.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected release binary not found at $exePath"
          }

          Copy-Item -Path $exePath -Destination (Join-Path $stageDir "EasySRT Studio.exe")
          Copy-Item -Path (Join-Path $PWD "src-tauri\resources\catalog.json") -Destination (Join-Path $resourcesDir "catalog.json")
          Set-Content -Path (Join-Path $stageDir "portable.flag") -Value "portable" -NoNewline -Encoding UTF8

          $zipPath = Join-Path $PWD "EasySRT-Studio-windows-x64-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath

      - name: Upload Windows Portable ZIP to GitHub Release
        if: matrix.platform == 'windows-latest' && steps.tauri-build.outputs.releaseUploadUrl != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
          UPLOAD_URL: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
        run: |
          $assetName = "EasySRT-Studio-windows-x64-portable.zip"
          $zipPath = Join-Path $PWD $assetName
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          # Remove existing portable asset if re-running on the same release
          if ($env:RELEASE_ID) {
            $assetsUrl = "https://api.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets"
            $existing = Invoke-RestMethod -Uri $assetsUrl -Headers $headers -Method Get
            foreach ($asset in $existing) {
              if ($asset.name -eq $assetName) {
                Invoke-RestMethod -Uri $asset.url -Headers $headers -Method Delete
              }
            }
          }

          $baseUploadUrl = $env:UPLOAD_URL -replace '\{\?name,label\}$', ''
          $targetUrl = "${baseUploadUrl}?name=$([uri]::EscapeDataString($assetName))"
          Invoke-RestMethod `
            -Uri $targetUrl `
            -Method Post `
            -Headers $headers `
            -ContentType "application/zip" `
            -InFile $zipPath

      - name: Upload Portable ZIP workflow artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: EasySRT-Studio-windows-x64-portable
          path: EasySRT-Studio-windows-x64-portable.zip

      - name: Build Linux Vulkan whisper-cli tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev cmake build-essential
          if apt-cache show glslc >/dev/null 2>&1; then
            sudo apt-get install -y glslc
          else
            # Ubuntu 22.04 lacks the glslc apt package; install glslc from the official LunarG SDK tarball
            curl -fsSL -o /tmp/vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
            mkdir -p /tmp/vulkan-sdk
            tar -xf /tmp/vulkan-sdk.tar.xz -C /tmp/vulkan-sdk --strip-components=1
            GLSLC_DIR="$(dirname "$(find /tmp/vulkan-sdk -type f -name glslc | head -n 1)")"
            export PATH="$GLSLC_DIR:$PATH"
          fi

          GLSLC_BIN="$(command -v glslc)"
          test -n "$GLSLC_BIN"

          rm -rf /tmp/whisper-cpp-src /tmp/whisper-cpp-build whisper-bin-ubuntu-vulkan-x64
          git clone --depth 1 --branch b5907 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-cpp-src
          cmake -S /tmp/whisper-cpp-src -B /tmp/whisper-cpp-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_VULKAN=ON \
            -DVulkan_GLSLC_EXECUTABLE="$GLSLC_BIN" \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper-cpp-build --target whisper-cli -j"$(nproc)"

          mkdir -p whisper-bin-ubuntu-vulkan-x64
          WHISPER_CLI_PATH="$(find /tmp/whisper-cpp-build -type f -name 'whisper-cli' | head -n 1)"
          test -n "$WHISPER_CLI_PATH"
          cp "$WHISPER_CLI_PATH" whisper-bin-ubuntu-vulkan-x64/whisper-cli
          find /tmp/whisper-cpp-build -name '*.so*' -exec cp -P {} whisper-bin-ubuntu-vulkan-x64/ \; || true
          patchelf --set-rpath '$ORIGIN' whisper-bin-ubuntu-vulkan-x64/whisper-cli || true
          chmod +x whisper-bin-ubuntu-vulkan-x64/whisper-cli

          tar -czf whisper-bin-ubuntu-vulkan-x64.tar.gz whisper-bin-ubuntu-vulkan-x64
          sha256sum whisper-bin-ubuntu-vulkan-x64.tar.gz > whisper-bin-ubuntu-vulkan-x64.tar.gz.sha256
          rm -rf /tmp/whisper-cpp-src /tmp/whisper-cpp-build /tmp/vulkan-sdk /tmp/vulkan-sdk.tar.xz whisper-bin-ubuntu-vulkan-x64

      - name: Upload Linux Vulkan whisper-cli tarball to GitHub Release
        if: matrix.platform == 'ubuntu-22.04' && steps.tauri-build.outputs.releaseUploadUrl != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
          UPLOAD_URL: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
        run: |
          ASSET_NAME="whisper-bin-ubuntu-vulkan-x64.tar.gz"
          BASE_UPLOAD_URL="${UPLOAD_URL%\{*}"
          if [ -n "$RELEASE_ID" ]; then
            EXISTING_URL=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); const match = data.find(a => a.name === '$ASSET_NAME'); if (match) process.stdout.write(match.url);")
            if [ -n "$EXISTING_URL" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$EXISTING_URL"
            fi
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$ASSET_NAME" \
            "${BASE_UPLOAD_URL}?name=$ASSET_NAME"

      - name: Upload Linux Vulkan whisper-cli workflow artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: whisper-bin-ubuntu-vulkan-x64
          path: |
            whisper-bin-ubuntu-vulkan-x64.tar.gz
            whisper-bin-ubuntu-vulkan-x64.tar.gz.sha256
