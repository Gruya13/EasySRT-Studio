name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: ubuntu-22.04
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build and publish Tauri bundles
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "EasySRT Studio v__VERSION__"
          releaseBody: "See the assets below to download EasySRT Studio (Windows NSIS installer, Windows Portable ZIP, or Linux AppImage)."
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

      - name: Package Windows Portable ZIP
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $stageDir = Join-Path $PWD "portable-stage"
          $resourcesDir = Join-Path $stageDir "resources"
          New-Item -ItemType Directory -Force -Path $resourcesDir | Out-Null

          $exePath = Join-Path $PWD "src-tauri\target\release\easysrt-studio.exe"
          if (-not (Test-Path $exePath)) {
            throw "Expected release binary not found at $exePath"
          }

          Copy-Item -Path $exePath -Destination (Join-Path $stageDir "EasySRT Studio.exe")
          Copy-Item -Path (Join-Path $PWD "src-tauri\resources\catalog.json") -Destination (Join-Path $resourcesDir "catalog.json")
          Set-Content -Path (Join-Path $stageDir "portable.flag") -Value "portable" -NoNewline -Encoding UTF8

          $zipPath = Join-Path $PWD "EasySRT-Studio-windows-x64-portable.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $stageDir "*") -DestinationPath $zipPath

      - name: Upload Windows Portable ZIP to GitHub Release
        if: matrix.platform == 'windows-latest' && steps.tauri-build.outputs.releaseUploadUrl != ''
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
          UPLOAD_URL: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
        run: |
          $assetName = "EasySRT-Studio-windows-x64-portable.zip"
          $zipPath = Join-Path $PWD $assetName
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept        = "application/vnd.github+json"
          }

          # Remove existing portable asset if re-running on the same release
          if ($env:RELEASE_ID) {
            $assetsUrl = "https://api.github.com/repos/${{ github.repository }}/releases/$env:RELEASE_ID/assets"
            $existing = Invoke-RestMethod -Uri $assetsUrl -Headers $headers -Method Get
            foreach ($asset in $existing) {
              if ($asset.name -eq $assetName) {
                Invoke-RestMethod -Uri $asset.url -Headers $headers -Method Delete
              }
            }
          }

          $baseUploadUrl = $env:UPLOAD_URL -replace '\{\?name,label\}$', ''
          $targetUrl = "${baseUploadUrl}?name=$([uri]::EscapeDataString($assetName))"
          Invoke-RestMethod `
            -Uri $targetUrl `
            -Method Post `
            -Headers $headers `
            -ContentType "application/zip" `
            -InFile $zipPath

      - name: Upload Portable ZIP workflow artifact
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: EasySRT-Studio-windows-x64-portable
          path: EasySRT-Studio-windows-x64-portable.zip
