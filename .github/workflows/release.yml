name: Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      prerelease:
        description: "Publish as a GitHub Pre-release (does not overwrite production latest.json)"
        type: boolean
        default: true
      tag_suffix:
        description: "Optional pre-release tag suffix (e.g. rc.1; defaults to staging.<shortsha>)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    name: Prepare Release Metadata & Tag
    runs-on: ubuntu-22.04
    outputs:
      should_release: ${{ steps.meta.outputs.should_release }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      release_name: ${{ steps.meta.outputs.release_name }}
      is_prerelease: ${{ steps.meta.outputs.is_prerelease }}
      include_updater_json: ${{ steps.meta.outputs.include_updater_json }}
      release_body: ${{ steps.meta.outputs.release_body }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify manifest versions are in sync
        run: npm run version:check

      - name: Resolve release target, tag, and changelog notes
        id: meta
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          FULL_REF: ${{ github.ref }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
          INPUT_TAG_SUFFIX: ${{ inputs.tag_suffix }}
        run: |
          set -euo pipefail

          VERSION="$(node -p "require('./package.json').version")"
          SHORT_SHA="$(git rev-parse --short=7 HEAD)"

          SHOULD_RELEASE="false"
          TAG_NAME=""
          RELEASE_NAME=""
          IS_PRERELEASE="false"
          INCLUDE_UPDATER_JSON="true"
          CREATE_TAG="false"

          if [ "$EVENT_NAME" = "push" ] && [ "$FULL_REF" = "refs/heads/main" ]; then
            TAG_NAME="v${VERSION}"
            if git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              echo "Tag ${TAG_NAME} already exists; skipping automatic release for non-release commit on main."
              SHOULD_RELEASE="false"
            else
              SHOULD_RELEASE="true"
              IS_PRERELEASE="false"
              INCLUDE_UPDATER_JSON="true"
              RELEASE_NAME="EasySRT Studio ${TAG_NAME}"
              CREATE_TAG="true"
            fi
          elif [ "$EVENT_NAME" = "push" ] && [ "$REF_TYPE" = "tag" ]; then
            TAG_NAME="$REF_NAME"
            SHOULD_RELEASE="true"
            if [[ "$TAG_NAME" == *-* ]]; then
              IS_PRERELEASE="true"
              INCLUDE_UPDATER_JSON="false"
              RELEASE_NAME="EasySRT Studio ${TAG_NAME} (Pre-release)"
            else
              if [ "$TAG_NAME" != "v${VERSION}" ]; then
                echo "Tag ${TAG_NAME} does not match package.json version v${VERSION}." >&2
                exit 1
              fi
              IS_PRERELEASE="false"
              INCLUDE_UPDATER_JSON="true"
              RELEASE_NAME="EasySRT Studio ${TAG_NAME}"
            fi
          elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_RELEASE="true"
            if [ "$INPUT_PRERELEASE" = "true" ] || [ "$FULL_REF" != "refs/heads/main" ]; then
              SUFFIX="${INPUT_TAG_SUFFIX:-staging.${SHORT_SHA}}"
              TAG_NAME="v${VERSION}-${SUFFIX}"
              IS_PRERELEASE="true"
              INCLUDE_UPDATER_JSON="false"
              RELEASE_NAME="EasySRT Studio ${TAG_NAME} (Staging)"
              CREATE_TAG="true"
            else
              TAG_NAME="v${VERSION}"
              IS_PRERELEASE="false"
              INCLUDE_UPDATER_JSON="true"
              RELEASE_NAME="EasySRT Studio ${TAG_NAME}"
              CREATE_TAG="true"
            fi
          fi

          if [ "$SHOULD_RELEASE" = "true" ] && [ "$CREATE_TAG" = "true" ]; then
            if ! git rev-parse -q --verify "refs/tags/${TAG_NAME}" >/dev/null; then
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git tag -a "$TAG_NAME" -m "Release ${TAG_NAME}"
              git push origin "$TAG_NAME"
            fi
          fi

          RELEASE_BODY=""
          if [ "$SHOULD_RELEASE" = "true" ]; then
            if [ "$IS_PRERELEASE" = "true" ]; then
              RELEASE_BODY="$(node scripts/release.mjs notes "$VERSION" --prerelease --with-footer)"
            else
              RELEASE_BODY="$(node scripts/release.mjs notes "$VERSION" --with-footer)"
            fi
          fi

          {
            echo "should_release=${SHOULD_RELEASE}"
            echo "tag_name=${TAG_NAME}"
            echo "release_name=${RELEASE_NAME}"
            echo "is_prerelease=${IS_PRERELEASE}"
            echo "include_updater_json=${INCLUDE_UPDATER_JSON}"
          } >> "$GITHUB_OUTPUT"

          EOF_DELIM="EOF_RELEASE_NOTES_${RANDOM}_${RANDOM}"
          {
            echo "release_body<<${EOF_DELIM}"
            printf '%s\n' "$RELEASE_BODY"
            echo "${EOF_DELIM}"
          } >> "$GITHUB_OUTPUT"

  publish-tauri:
    name: Build & Publish (${{ matrix.platform }})
    needs: prepare-release
    if: needs.prepare-release.outputs.should_release == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: "--bundles nsis"
          - platform: ubuntu-22.04
            args: "--bundles appimage"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify manifest versions are in sync
        run: npm run version:check

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Stage Windows MSVC Runtime DLLs
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          $destDir = Join-Path $PWD "src-tauri\resources\vcruntime"
          New-Item -ItemType Directory -Force -Path $destDir | Out-Null

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = ""
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath | Select-Object -First 1
          }

          $searchRoots = @()
          if ($vsPath) { $searchRoots += (Join-Path $vsPath "VC\Redist\MSVC") }
          $searchRoots += "C:\Program Files\Microsoft Visual Studio\*\*\VC\Redist\MSVC"
          $searchRoots += "C:\Program Files (x86)\Microsoft Visual Studio\*\*\VC\Redist\MSVC"

          $dllNames = @(
            "vcruntime140.dll",
            "vcruntime140_1.dll",
            "msvcp140.dll",
            "msvcp140_1.dll",
            "msvcp140_2.dll",
            "concrt140.dll",
            "vcomp140.dll"
          )

          foreach ($dll in $dllNames) {
            $found = $null
            foreach ($root in $searchRoots) {
              $found = Get-ChildItem -Path $root -Recurse -File -Filter $dll -ErrorAction SilentlyContinue |
                Where-Object { $_.FullName -match '\\x64\\' -and $_.FullName -notmatch 'onecore|debug_nonredist' } |
                Sort-Object FullName -Descending |
                Select-Object -First 1
              if ($found) { break }
            }
            if ($found) {
              Copy-Item -Path $found.FullName -Destination (Join-Path $destDir $dll) -Force
              Write-Output "Staged $dll from $($found.FullName)"
            } else {
              Write-Warning "Optional/candidate DLL not found in VS Redist: $dll"
            }
          }

          foreach ($requiredDll in @("vcruntime140.dll", "vcruntime140_1.dll", "msvcp140.dll", "vcomp140.dll")) {
            $staged = Join-Path $destDir $requiredDll
            if (-not (Test-Path $staged)) {
              throw "Required MSVC runtime DLL missing after staging: $staged"
            }
          }

      - name: Build and publish Tauri bundles
        id: tauri-build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ needs.prepare-release.outputs.tag_name }}
          releaseName: ${{ needs.prepare-release.outputs.release_name }}
          releaseBody: ${{ needs.prepare-release.outputs.release_body }}
          releaseDraft: false
          prerelease: ${{ needs.prepare-release.outputs.is_prerelease == 'true' }}
          includeUpdaterJson: ${{ needs.prepare-release.outputs.include_updater_json == 'true' }}
          args: ${{ matrix.args }}

      - name: Build Linux Vulkan whisper-cli tarball
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libvulkan-dev cmake build-essential

          # Ubuntu 22.04 ships outdated Vulkan headers and lacks glslc; use the official LunarG Vulkan SDK
          curl -fsSL -o /tmp/vulkan-sdk.tar.xz https://sdk.lunarg.com/sdk/download/latest/linux/vulkan-sdk.tar.xz
          rm -rf /tmp/vulkan-sdk
          mkdir -p /tmp/vulkan-sdk
          tar -xf /tmp/vulkan-sdk.tar.xz -C /tmp/vulkan-sdk --strip-components=1

          GLSLC_BIN="$(find /tmp/vulkan-sdk -type f -name glslc | head -n 1)"
          test -n "$GLSLC_BIN"
          export PATH="$(dirname "$GLSLC_BIN"):$PATH"

          VULKAN_HEADER="$(find /tmp/vulkan-sdk -path '*/include/vulkan/vulkan.h' | head -n 1)"
          test -n "$VULKAN_HEADER"
          VULKAN_INCLUDE_DIR="$(dirname "$(dirname "$VULKAN_HEADER")")"
          VULKAN_SDK_PREFIX="$(dirname "$VULKAN_INCLUDE_DIR")"
          export VULKAN_SDK="$VULKAN_SDK_PREFIX"

          rm -rf /tmp/whisper-cpp-src /tmp/whisper-cpp-build whisper-bin-ubuntu-vulkan-x64
          git clone --depth 1 --branch b5907 https://github.com/ggml-org/whisper.cpp.git /tmp/whisper-cpp-src
          cmake -S /tmp/whisper-cpp-src -B /tmp/whisper-cpp-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$VULKAN_SDK_PREFIX" \
            -DBUILD_SHARED_LIBS=OFF \
            -DGGML_VULKAN=ON \
            -DVulkan_INCLUDE_DIR="$VULKAN_INCLUDE_DIR" \
            -DVulkan_GLSLC_EXECUTABLE="$GLSLC_BIN" \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON
          cmake --build /tmp/whisper-cpp-build --target whisper-cli -j"$(nproc)"

          mkdir -p whisper-bin-ubuntu-vulkan-x64
          WHISPER_CLI_PATH="$(find /tmp/whisper-cpp-build -type f -name 'whisper-cli' | head -n 1)"
          test -n "$WHISPER_CLI_PATH"
          cp "$WHISPER_CLI_PATH" whisper-bin-ubuntu-vulkan-x64/whisper-cli
          find /tmp/whisper-cpp-build -name '*.so*' -exec cp -P {} whisper-bin-ubuntu-vulkan-x64/ \; || true
          patchelf --set-rpath '$ORIGIN' whisper-bin-ubuntu-vulkan-x64/whisper-cli || true
          chmod +x whisper-bin-ubuntu-vulkan-x64/whisper-cli

          tar -czf whisper-bin-ubuntu-vulkan-x64.tar.gz whisper-bin-ubuntu-vulkan-x64
          sha256sum whisper-bin-ubuntu-vulkan-x64.tar.gz > whisper-bin-ubuntu-vulkan-x64.tar.gz.sha256
          rm -rf /tmp/whisper-cpp-src /tmp/whisper-cpp-build /tmp/vulkan-sdk /tmp/vulkan-sdk.tar.xz whisper-bin-ubuntu-vulkan-x64

      - name: Upload Linux Vulkan whisper-cli tarball to GitHub Release
        if: matrix.platform == 'ubuntu-22.04' && steps.tauri-build.outputs.releaseUploadUrl != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri-build.outputs.releaseId }}
          UPLOAD_URL: ${{ steps.tauri-build.outputs.releaseUploadUrl }}
        run: |
          ASSET_NAME="whisper-bin-ubuntu-vulkan-x64.tar.gz"
          BASE_UPLOAD_URL="${UPLOAD_URL%\{*}"
          if [ -n "$RELEASE_ID" ]; then
            EXISTING_URL=$(curl -fsSL \
              -H "Authorization: Bearer $GITHUB_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/releases/$RELEASE_ID/assets" \
              | node -e "const fs = require('fs'); const data = JSON.parse(fs.readFileSync(0, 'utf8')); const match = data.find(a => a.name === '$ASSET_NAME'); if (match) process.stdout.write(match.url);")
            if [ -n "$EXISTING_URL" ]; then
              curl -fsSL -X DELETE \
                -H "Authorization: Bearer $GITHUB_TOKEN" \
                -H "Accept: application/vnd.github+json" \
                "$EXISTING_URL"
            fi
          fi
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/gzip" \
            --data-binary "@$ASSET_NAME" \
            "${BASE_UPLOAD_URL}?name=$ASSET_NAME"

      - name: Upload Linux Vulkan whisper-cli workflow artifact
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: whisper-bin-ubuntu-vulkan-x64
          path: |
            whisper-bin-ubuntu-vulkan-x64.tar.gz
            whisper-bin-ubuntu-vulkan-x64.tar.gz.sha256
