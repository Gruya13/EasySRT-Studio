name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-test:
    name: Frontend & Rust Backend CI
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify manifest versions are in sync
        run: npm run version:check

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend and tooling unit tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

      - name: Check, test, and lint Rust Tauri backend
        run: |
          cd src-tauri && cargo check --all-targets && cargo test && cargo clippy --all-targets -- -D warnings
