name: CI

on:
  push:
    branches:
      - main
      - staging
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-test:
    name: Frontend & Rust Backend CI
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: |
            package-lock.json
            worker/package-lock.json

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            ffmpeg

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend npm dependencies
        run: npm audit --audit-level=high

      - name: Verify manifest versions are in sync
        run: npm run version:check

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Run frontend and tooling unit tests
        run: npm test

      - name: Build frontend production bundle
        run: npm run build

      - name: Install, audit, typecheck, and test Cloudflare telemetry worker
        run: |
          cd worker
          npm ci
          npm audit --audit-level=high
          npm run typecheck
          npm test

      - name: Check, test, and lint Rust Tauri backend
        run: |
          cd src-tauri && cargo check --all-targets && cargo test && cargo clippy --all-targets -- -D warnings

      - name: Audit Rust dependencies (cargo audit)
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi
          cd src-tauri && cargo audit
